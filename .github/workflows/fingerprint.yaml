name: Fingerprint Check

on:
  push:
    branches:
      - main
      - '**'

jobs:
  fingerprint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: pip install -r scripts/requirements.txt

    - name: Generate Fingerprint
      run: |
        python scripts/fingerprint_generator.py . \
          --exclude README.md "*.png" "*.jpg" ".git/*/**" \
          --hash-algo sha256 \
          --verbose

    - name: Save Fingerprint and JSON as Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: project-fingerprint
        path: |
          file_hashes.txt
          project_fingerprint.txt
          fingerprint.json
